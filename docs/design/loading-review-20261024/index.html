<h1>加载与交互 · 2026-10-24</h1>
<p>来自 375pt 模拟器的实际 UI 测试截图，使用离线测试数据。自动续载截图中的文字用于确认第二页已经通过滑动加载；管理页未配置远程网站图标，显示原生后备图标。这些截图不代表线上站点或真机能耗测量。本轮修改已于 2026-10-24 随 TestFlight 1.0（33）上传；关于页截图拍摄后另移除了常驻 Markdown 说明文字。</p>
<div class="grid">
<figure><a href="management.png"><img src="management.png" alt="管理页缓存站点信息"></a><figcaption>管理页：保留站点身份及统计区域，重新进入不回到“我的小站”。</figcaption></figure>
<figure><a href="pagination.png"><img src="pagination.png" alt="絮语自动加载第二页"></a><figcaption>絮语：向上滑动自动加载第二页，无需点击“加载更多”。</figcaption></figure>
