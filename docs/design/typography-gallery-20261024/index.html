<h1>字体与图片浏览</h1>
<p>实际 iOS 模拟器截图与录屏，使用离线示例数据。宋体标题＋文楷正文；操作控件保持系统字体。模拟器回归不等于真机帧率测量。</p>
<section><h2>左右滑动实录</h2><p>原生全屏分页，连续快滑、反向与短拖取消。录屏仅截取操作片段，保持原速；图片为两张不同的测试资源。</p>
