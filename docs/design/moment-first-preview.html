let currentScreen='feed';let returnFromMusic='compose';let keyboard=false;let offline=false;let failure=false;let composingText='傍晚出去走了走，\n风经过树叶的时候，突然觉得今天也很好。';let articleTitle='把日常写成自己的风景';let articleText='最近开始习惯随手记录。\n\n一张照片，一首正好听到的歌，或者一个转瞬即逝的想法。不必等到它们足够完整，才值得被留下。\n\n## 慢下来，才能看见\n\n那些看似平常的片刻，连在一起，就是生活原本的样子。';let photos=[{id:1,art:0,state:'uploaded'},{id:2,art:1,state:'uploaded'},{id:3,art:2,state:'uploaded'}];let music=songs[0];let selectedSong=songs[0];let playing=null;let selectedPhotos=[];let draftExists=true;let musicType='song';let latestPublished=null;let serial=4;
const captions={feed:'想法成为默认首页。文字、照片、音乐都能直接开始，已有草稿也能顺手续写。',compose:'文字、图片与音乐组成同一条记录。逐张上传状态和本机保存状态清晰可见，失败时输入留在原地。',music:'先找到、听一听，再添加。歌曲与歌单分开，音乐添加后以可编辑卡片呈现。',article:'先写内容。标题和正文占据主要画布，分类、标签和 Slug 收进发布设置。',drafts:'未完成的内容有明确归处。按当前站点隔离，文字、图片与音乐一起恢复。',articles:'文章的草稿和发布状态一眼可辨。新建与继续编辑都有明确入口。',manage:'低频管理集中在这里，原有概览、评论和其他管理功能仍然可达。'};
function nav(active){return `<nav class="tabbar" aria-label="App 导航">${[['feed','想法','idea'],['articles','文章','article'],['drafts','草稿','draft'],['manage','管理','manage']].map(([screen,title,symbol])=>`<button class="tab ${active===screen?'active':''}" onclick="go('${screen}')">${icon(symbol)}<span>${title}</span></button>`).join('')}</nav>`}
function musicCard(song,editable=false){return `<div class="music-card"><div class="album ${song.theme}">${icon('music')}</div><div class="music-info"><div class="music-name">${escapeHTML(song.name)}</div><div class="subtle">${escapeHTML(song.artist)} · ${musicType==='playlist'?'歌单':'单曲'}</div></div><button class="music-play" onclick="togglePlay('${song.id}')" aria-label="${playing===song.id?'暂停':'试听'} ${song.name}">${icon(playing===song.id?'pause':'play')}</button></div>${editable?`<div class="card-actions"><button onclick="openMusic('${currentScreen}')">替换音乐</button><button onclick="music=null;render()">移除</button></div>`:''}`}
function feed(){return `<div class="screen"><div class="page-heading"><div><h2>想法</h2><div class="subtle">把此刻留下。</div></div><button class="round" onclick="go('drafts')" aria-label="打开本机草稿">${icon('draft')}</button></div><div class="entry"><button class="entry-main" onclick="go('compose');focusComposer()"><span class="small-leaf">${icon('leaf')}</span><span>此刻，想记下什么？</span></button><div class="entry-tools"><button class="text-btn" onclick="go('compose');openPicker()">${icon('photo')}照片</button><button class="text-btn" onclick="openMusic('compose')">${icon('music')}音乐</button></div></div>${draftExists?`<button class="continue" onclick="go('compose')">${icon('draft')}<span style="flex:1">继续上次记录 <span style="opacity:.7">· 刚刚</span></span>${icon('chevron')}</button>`:'<div style="height:16px"></div>'}<div class="section-label"><span>最近的记录</span><span>今天</span></div>${latestPublished?`<article class="feed-card"><div class="feed-inner"><div class="feed-meta"><span>刚刚 · 已发布</span>${icon('check')}</div><p class="feed-text">${escapeHTML(latestPublished)}</p></div></article>`:''}<article class="feed-card"><div class="feed-inner"><div class="feed-meta"><span>今天 18:42</span><button class="bare" aria-label="更多想法操作" onclick="showMomentActions()">${icon('more')}</button></div><p class="feed-text">下班路上绕了一点远路。<br>原来好看的风景，一直都在附近。</p><div class="single-photo" onclick="openGallery(0)">${landscape(0)}</div>${musicCard(songs[0])}</div></article><article class="feed-card"><div class="feed-inner"><div class="feed-meta"><span>昨天 09:16</span><button class="bare" onclick="showMomentActions()" aria-label="更多想法操作">${icon('more')}</button></div><p class="feed-text">不用等到很特别的一天，才开始记录。☀️</p><div class="photo-pair"><div onclick="openGallery(1)">${landscape(1)}</div><div onclick="openGallery(2)">${landscape(2)}</div></div></div></article></div><button class="fab" onclick="go('compose');focusComposer()">${icon('plus')}写想法</button>${nav('feed')}`}
function topbar(title,action,label){return `<header class="editor-top"><button class="close" onclick="closeEditor()" aria-label="保存草稿并关闭">${icon('close')}</button><div class="editor-title">${title}</div><button class="primary" onclick="${action}" ${currentScreen==='compose'&&photos.some(photo=>photo.state!=='uploaded')?'disabled':''}>${label}</button></header>`}
function keyboardMarkup(){return `<div class="keyboard ${keyboard?'':'hidden'}" aria-label="键盘位置示意"><div class="keys">${'QWERTYUIOP'.split('').map(key=>`<span class="key">${key}</span>`).join('')}</div><div class="keys">${'ASDFGHJKL'.split('').map(key=>`<span class="key">${key}</span>`).join('')}</div><div class="keys">${'ZXCVBNM'.split('').map(key=>`<span class="key">${key}</span>`).join('')}</div><div class="keys"><span class="key action">123</span><span class="key long">空格</span><span class="key action">换行</span></div></div>`}
function compose(){let waiting=photos.filter(photo=>photo.state!=='uploaded').length;return `${topbar('写想法','publish()','发布')}<div class="editor-scroll"><div class="saved">${icon('check')}已保存到本机</div>${offline?'<div class="state-banner">暂时离线，内容已保存在本机。<br>联网后可继续上传和发布。</div>':''}${waiting?`<div class="state-banner error">${waiting} 张图片${failure?'上传失败，请重试或移除。':'正在准备，完成后即可发布。'}</div>`:''}<textarea class="composer-text" aria-label="想法正文" placeholder="这一刻，想说点什么…" oninput="composingText=this.value;draftExists=true">${escapeHTML(composingText)}</textarea><div class="media-grid">${photos.map((photo,index)=>`<div class="media-cell"><div style="height:100%" onclick="openGallery(${photo.art})">${landscape(photo.art)}</div><button class="remove" onclick="removePhoto(${photo.id})" aria-label="移除第 ${index+1} 张图片"><span>×</span></button>${photo.state==='failed'?`<button class="media-label failed" onclick="retryPhoto(${photo.id})">上传失败 · 重试</button>`:photo.state==='uploading'?'<span class="media-label">上传中…</span>':''}</div>`).join('')}${photos.length<9?`<button class="media-cell add" onclick="openPicker()" aria-label="继续添加照片">${icon('plus')}<span>添加照片</span></button>`:''}</div><div class="image-count"><span>${photos.length}/9 张图片</span><button class="text-btn" style="font-size:12px" onclick="reorderPhotos()">调整顺序</button></div>${music?musicCard(music,true):''}</div><div class="media-toolbar"><button class="tool" onclick="openPicker()">${icon('photo')}照片</button><button class="tool" onclick="toast('拍照后进入同一图片流程（样稿演示）')">${icon('camera')}拍照</button><button class="tool" onclick="openMusic('compose')">${icon('music')}音乐</button><button class="tool" onclick="openMore()">${icon('more')}更多</button></div>${keyboardMarkup()}`}
function musicScreen(){return `<header class="editor-top"><button class="close" onclick="go(returnFromMusic)" aria-label="关闭音乐选择">${icon('close')}</button><div class="editor-title">添加音乐</div><div style="width:44px"></div></header><div class="music-body"><div class="search">${icon('search')}<input id="music-query" aria-label="搜索歌曲或歌手" placeholder="搜索歌曲名或歌手" oninput="filterMusic(this.value)"></div><div class="segmented"><button class="segment ${musicType==='song'?'active':''}" onclick="musicType='song';render()">歌曲</button><button class="segment ${musicType==='playlist'?'active':''}" onclick="musicType='playlist';render()">歌单</button></div><div class="section-label"><span id="music-heading">最近添加</span><span>QQ 音乐</span></div><div id="song-results">${songs.map(song=>`<div class="music-row" data-key="${song.name} ${song.artist}" onclick="chooseSong('${song.id}')"><div class="album ${song.theme}">${icon('music')}</div><div class="music-info"><div class="music-name">${song.name}${musicType==='playlist'?' · 歌单':''}</div><div class="subtle">${song.artist}<br>${song.album}${musicType==='playlist'?' · 24 首':''}</div></div><button class="music-play" onclick="event.stopPropagation();togglePlay('${song.id}')" aria-label="试听 ${song.name}">${icon(playing===song.id?'pause':'play')}</button><span class="choice ${selectedSong?.id===song.id?'selected':''}" aria-label="${selectedSong?.id===song.id?'已选':'未选'}">✓</span></div>`).join('')}</div><div class="empty" id="no-songs" hidden>没找到这首音乐<br>试试歌曲名或歌手</div>${musicType==='playlist'?'<label class="subtle" style="display:flex;gap:10px;margin-top:18px"><input type="checkbox">随机播放这个歌单</label>':''}<details class="manual"><summary>粘贴链接或手动输入</summary><input aria-label="音乐链接或标记" placeholder="QQ 音乐链接或 qqvip:id:song"><p>也可以在搜索里找到歌曲后添加。</p></details></div><div class="bottom-action"><button class="primary" onclick="insertMusic()" ${selectedSong?'':'disabled'}>${musicType==='playlist'?'添加这个歌单':'添加这首音乐'}</button></div>`}
function article(){return `${topbar('写文章','toast(\'演示：打开发布设置确认后发布\');openSettings()','发布')}<div class="editor-scroll"><div class="saved">${icon('check')}本机草稿 · 刚刚保存</div><textarea class="article-title" rows="2" aria-label="文章标题" oninput="articleTitle=this.value">${escapeHTML(articleTitle)}</textarea><div class="article-meta"><span>随笔</span><span>约 2 分钟阅读</span><span style="margin-left:auto">${articleText.length} 字</span></div><textarea class="composer-text article-text" aria-label="文章正文" oninput="articleText=this.value">${escapeHTML(articleText)}</textarea><button class="article-settings" onclick="openSettings()"><span>封面、分类与发布设置</span>${icon('chevron')}</button></div><div class="media-toolbar"><button class="tool" onclick="openPicker()">${icon('photo')}照片</button><button class="tool" onclick="openMusic('article')">${icon('music')}音乐</button><button class="tool" onclick="toast('格式工具：标题、加粗、引用、列表、代码')">${icon('format')}格式</button><button class="tool" onclick="previewArticle()">${icon('eye')}预览</button></div>${keyboardMarkup()}`}
function articles(){return `<div class="screen"><div class="page-heading"><div><h2>文章</h2><div class="subtle">留一点时间，好好写。</div></div><button class="round" onclick="go('article')" aria-label="写文章">${icon('edit')}</button></div><div class="segmented"><button class="segment active" onclick="filterArticles('all',this)">全部</button><button class="segment" onclick="filterArticles('draft',this)">草稿</button><button class="segment" onclick="filterArticles('published',this)">已发布</button></div><article class="article-card" data-status="draft" onclick="go('article')"><span class="badge">草稿</span><h3>把日常写成自己的风景</h3><p>一张照片，一首正好听到的歌，或者一个转瞬即逝的想法……</p><span class="subtle">刚刚编辑 · 随笔</span></article><article class="article-card" data-status="published" onclick="go('article')"><div class="single-photo" style="height:140px">${landscape(2)}</div><h3>去有风的地方</h3><p>沿着河边慢慢走，城市也有安静的一面。</p><span class="subtle">昨天发布 · 生活</span></article></div><button class="fab" onclick="go('article')">${icon('plus')}写文章</button>${nav('articles')}`}
function drafts(){return `<div class="screen"><div class="page-heading"><div><h2>草稿</h2><div class="subtle">写到一半，也好好留着。</div></div><span class="small-leaf">${icon('draft')}</span></div><div class="state-banner">仅保存在这台设备 · 当前站点<br><span class="subtle">发布成功后，会移除对应的本机草稿。</span></div><div class="segmented"><button class="segment active" onclick="filterDrafts('moment',this)">想法</button><button class="segment" onclick="filterDrafts('post',this)">文章</button></div><div id="moment-drafts"><article class="draft-card" onclick="go('compose')"><div class="draft-copy"><span class="tag">未发布</span><div class="draft-title">傍晚出去走了走，风经过树叶的时候…</div><span class="subtle">${photos.length} 张图片 · 1 首音乐</span><div class="draft-footer">刚刚保存</div></div><div class="draft-thumb">${landscape(0)}</div></article><article class="draft-card" onclick="toast('演示：恢复选中的想法草稿')"><div class="draft-copy"><span class="tag">未发布</span><div class="draft-title">想把周末的几个片段串起来。</div><span class="subtle">纯文字</span><div class="draft-footer">昨天 21:08</div></div></article></div><div id="post-drafts" hidden><article class="draft-card" onclick="go('article')"><div class="draft-copy"><span class="tag">文章草稿</span><div class="draft-title">把日常写成自己的风景</div><span class="subtle">${articleText.length} 字</span><div class="draft-footer">刚刚保存</div></div></article></div></div>${nav('drafts')}`}
function manage(){return `<div class="screen"><div class="page-heading"><div><h2>管理</h2><div class="subtle">你的站点，一切照常。</div></div><span class="small-leaf">${icon('leaf')}</span></div><div class="feed-card" style="padding:0 16px">${['网站概览','评论','附件','作品','引用管理','分类与标签','站点设置','部署状态'].map(label=>`<button class="panel-link" onclick="toast('保留原有${label}入口')"><span>${label}</span>${icon('chevron')}</button>`).join('')}</div></div>${nav('manage')}`}
let musicQuery='';
function render(){document.querySelectorAll('.chapter').forEach(button=>button.classList.toggle('active',button.dataset.screen===currentScreen));app.innerHTML=({feed,compose,music:musicScreen,article,articles,drafts,manage}[currentScreen]||feed)();document.getElementById('caption').textContent=captions[currentScreen]||'';if(currentScreen==='music'){document.getElementById('music-query').value=musicQuery;filterMusic(musicQuery)}}
function go(screen){playing=null;currentScreen=screen;removeOverlay();render()}
function focusComposer(){requestAnimationFrame(()=>document.querySelector('.composer-text')?.focus({preventScroll:true}))}
function closeEditor(){draftExists=true;go(currentScreen==='article'?'articles':'feed');toast('已保留本机草稿')}
function openMusic(origin){returnFromMusic=origin;go('music')}
function togglePlay(id){playing=playing===id?null:id;render()}
function chooseSong(id){selectedSong=songs.find(song=>song.id===id);render()}
function insertMusic(){if(!selectedSong)return;music=selectedSong;go(returnFromMusic);if(returnFromMusic==='article'){articleText+='\n\n♫ '+music.name+' · '+music.artist;render()}toast('音乐已添加')}
function filterMusic(value){musicQuery=value;let visible=0;document.querySelectorAll('.music-row').forEach(row=>{let matches=row.dataset.key.includes(value.trim());row.hidden=!matches;row.style.display=matches?'flex':'none';if(matches)visible++});document.getElementById('no-songs').hidden=visible>0;document.getElementById('music-heading').textContent=value.trim()?'搜索结果':'最近添加'}
function filterDrafts(type,button){document.querySelectorAll('.segment').forEach(element=>element.classList.toggle('active',element===button));document.getElementById('moment-drafts').hidden=type!=='moment';document.getElementById('post-drafts').hidden=type!=='post'}
function filterArticles(type,button){document.querySelectorAll('.segment').forEach(element=>element.classList.toggle('active',element===button));document.querySelectorAll('.article-card').forEach(card=>card.hidden=type!=='all'&&card.dataset.status!==type)}
function toast(message){document.querySelector('.toast')?.remove();const element=document.createElement('div');element.className='toast';element.role='status';element.textContent=message;device.append(element);setTimeout(()=>element.remove(),2600)}
function removeOverlay(){document.querySelector('.overlay')?.remove()}
function overlay(title,content,bottom=''){removeOverlay();const panel=document.createElement('section');panel.className='overlay';panel.setAttribute('role','dialog');panel.setAttribute('aria-label',title);panel.innerHTML=`<header class="editor-top"><button class="close" onclick="removeOverlay()" aria-label="关闭">${icon('close')}</button><div class="editor-title">${title}</div><div style="width:44px"></div></header>${content}${bottom}`;device.append(panel)}
function openPicker(){selectedPhotos=[];overlay('选择照片',`<div class="picker-tip">最多添加 ${9-photos.length} 张 · 此处为相册选择演示</div><div class="picker-grid">${Array.from({length:9},(_,index)=>`<button class="picker-photo" onclick="selectPhoto(${index},this)" aria-label="选择示意照片 ${index+1}">${landscape(index)}<span class="picker-mark"></span></button>`).join('')}</div>`,`<div class="bottom-action" style="margin-top:auto"><button class="primary" id="confirm-photos" onclick="confirmPhotos()" disabled>添加照片</button></div>`)}
function selectPhoto(index,button){if(selectedPhotos.includes(index)){selectedPhotos=selectedPhotos.filter(value=>value!==index)}else if(selectedPhotos.length<9-photos.length){selectedPhotos.push(index)}else{toast('最多 9 张图片');return}document.querySelectorAll('.picker-photo').forEach((element,photoIndex)=>{let order=selectedPhotos.indexOf(photoIndex);let mark=element.querySelector('.picker-mark');mark.classList.toggle('selected',order>=0);mark.textContent=order>=0?order+1:''});const confirm=document.getElementById('confirm-photos');confirm.disabled=selectedPhotos.length===0;confirm.textContent=selectedPhotos.length?`添加 ${selectedPhotos.length} 张照片`:'添加照片'}
function confirmPhotos(){let added=selectedPhotos.map(index=>({id:serial++,art:index,state:offline?'failed':'uploading'}));photos.push(...added);removeOverlay();render();if(currentScreen==='article'){toast('演示：照片将插入正文光标处')}if(!offline)setTimeout(()=>{added.forEach(photo=>{const current=photos.find(value=>value.id===photo.id);if(current)current.state='uploaded'});render()},1100)}
function removePhoto(id){photos=photos.filter(photo=>photo.id!==id);render()}
function retryPhoto(id){if(offline){toast('仍处于离线状态，草稿已保留');return}const photo=photos.find(item=>item.id===id);if(!photo)return;photo.state='uploading';failure=false;document.getElementById('failure-toggle').setAttribute('aria-pressed','false');render();setTimeout(()=>{const current=photos.find(item=>item.id===id);if(current)current.state='uploaded';render();toast('这张图片已上传')},900)}
function reorderPhotos(){if(photos.length<2){toast('添加两张图片后即可调整顺序');return}photos.push(photos.shift());render();toast('示意：第一张已移到最后')}
function openGallery(index){overlay('照片预览',`<div class="gallery">${landscape(index)}</div><div class="picker-tip">预览原图 · 关闭后保留当前编辑</div>`)}
function publish(){if(offline){toast('暂时离线，草稿已保留');return}if(!composingText.trim()&&!photos.length&&!music){toast('写点什么，或添加照片与音乐');return}if(photos.some(photo=>photo.state!=='uploaded')){toast('请先完成图片上传');return}latestPublished=composingText.trim()||'分享了图片和音乐';draftExists=false;go('feed');toast('演示发布成功 · 未发送到服务器')}
function openMore(){overlay('更多创作工具',`<div class="sheet-content">${['插入视频','插入引用','Markdown 预览','舍弃这份草稿'].map(label=>`<button class="panel-link" onclick="toast('${label==='舍弃这份草稿'?'原生实现会先确认，再清理这份本机草稿':'演示：'+label}')">${label}${icon('chevron')}</button>`).join('')}</div>`)}
function showMomentActions(){overlay('想法操作',`<div class="sheet-content"><button class="panel-link" onclick="go('compose')">编辑想法${icon('edit')}</button><button class="panel-link" onclick="toast('演示：复制纯文字')">复制文字${icon('draft')}</button><button class="panel-link" style="color:var(--danger)" onclick="toast('原生实现会先确认删除')">删除想法${icon('close')}</button></div>`)}
function openSettings(){overlay('发布设置',`<div class="sheet-content"><div class="single-photo" style="height:128px">${landscape(1)}</div><button class="text-btn" style="margin-top:8px" onclick="toast('演示：从相册更换封面')">${icon('photo')}更换封面</button><label class="setting-row">文章地址（已自动生成）<input value="everyday-landscape" aria-label="文章 Slug"></label><label class="setting-row">分类<input value="随笔" aria-label="文章分类"></label><label class="setting-row">标签<input placeholder="添加标签" aria-label="文章标签"></label><div class="picker-tip" style="padding:17px 0">发布后公开显示在当前站点。<br>未发布的修改仍保留在本机草稿。</div></div>`,`<div class="bottom-action" style="margin-top:auto"><button class="primary" onclick="removeOverlay();go('articles');toast('演示发布成功 · 未发送到服务器')">确认发布</button></div>`)}
function previewArticle(){overlay('文章预览',`<div class="sheet-content"><h2 style="font-size:27px;line-height:1.5">${escapeHTML(articleTitle)}</h2><div style="font-size:17px;line-height:1.95;white-space:pre-wrap">${escapeHTML(articleText.replace(/^## /gm,''))}</div></div>`)}
document.querySelectorAll('.chapter').forEach(button=>button.addEventListener('click',()=>go(button.dataset.screen)));
document.getElementById('theme-toggle').addEventListener('click',event=>{const dark=device.classList.toggle('dark');event.currentTarget.setAttribute('aria-pressed',String(dark))});
document.getElementById('keyboard-toggle').addEventListener('click',event=>{keyboard=!keyboard;event.currentTarget.setAttribute('aria-pressed',String(keyboard));if(!['compose','article'].includes(currentScreen))currentScreen='compose';render()});
document.getElementById('failure-toggle').addEventListener('click',event=>{failure=!failure;event.currentTarget.setAttribute('aria-pressed',String(failure));if(!photos.length)photos.push({id:serial++,art:0,state:'uploaded'});photos[0].state=failure?'failed':'uploaded';currentScreen='compose';render()});
document.getElementById('offline-toggle').addEventListener('click',event=>{offline=!offline;event.currentTarget.setAttribute('aria-pressed',String(offline));currentScreen='compose';render()});
render();
</script>
</body>
</html>
